# This file controls which files are being processed by PSyclone,
# both using PSyclone's transmute ability (transformation generic
# Fortran files), and its DSL (kernel based) capability.

# First we specify the phases for PSyclone. This allows
# any apps to run transmute and DSL steps in any order just by
# changing (or supplying a different) psyclone-info file.
# In this example, we run a transmute step before and after the DSL step.
# This allows transforming source code before PSyclone runs its DSL
# processing (during which transformed source code might be inlined).
# The third step is done to support feedback from the DSL processing
# to trigger additional processing (for example, if the DSL processing
# adds OpenACC directive, it might determine that additional source
# files need to be marked up to be compiled for OpenACC, which can then
# be done in an additional transmute phase).

phases:
  # Define three phases: a transmutation, then DSL, then another transmutation
  - dsl
  - transmute_after_dsl

# Each section contains:
# - a comment (to be logged during execution),
# - PSyclone API (to select DSL or transmute).
# - script_dir:  subdirectory (under optimisation/SITE) to find the scripts
#   (atm transmute, psykal - but different names could be used).
#
# Then it contains a list of specifications to control which
# script to run on which file. Each specification is a keyword or script
# name, followed by a list of file names. The last matching specification
# will be used, allowing to start with the most generic specification
# (think global.py), but then overwriting this in following specifications.
# Matching of filenames is done using simple substrings search on the full
# path (i.e. no regex or wildcard - though that could easily be added).
# This makes it easy to also select sub-directories etc) 

# Fab will support to load several psyclone-info files. Later files will
# overwrite settings (e.g. the phases to run), or add to the rules (i.e.
# all rules will be appended to the list of rules to use, since last-rule
# wins, this means a site can add its own psyclone-info file to
# fine-tune the behaviour for certain files.

dsl:
  comment: "PSylone DSL Phase"
  api: lfric

  script_dir: psykal

  # The first two directives reproduce the default PSyclone triggering used
  # in LFRic:

  # Run optimisation/.../global.py on all x90 files
  global.py: \*

  # This represents existing functionality: if there is a file-specific .py
  # file, use it. The specification of '*' does not trigger an error
  # if there is no file_specific script (while explicitly putting a name
  # here as shown in the previous pre_dsl phase will trigger an error, to
  # catch typos early)
  file_specific: \*

  # An option that is not possible to use atm: Run one script on several
  # files. ATM in lfric_atm, there are duplicated scripts
  # (e.g. conv_comorph_alg, conv_gr_alg, aerosol_ukca_alg), which can
  # be avoided with this.
  no_omp.py: /a/b/file1.f90 some_directory

transmute_after_dsl:
  # As above
  comment: "Post-DSL phase"
  api:
  script_dir: transmute

  global.py:
    mphys_kernel_mod

  boundary_layer/local.py:
    /bl_lsp
    /btq_int
    /ex_flux_tq
    /ex_flux_uv
    /fm_drag
    /imp_mix
    /kmkh

  file_specific:
    /bm_tau_kernel_mod
    /conv_gr_kernel_mod
    /gw_ussp_mod
    /jules_exp_kernel_mod
    /jules_extra_kernel_mod
    /jules_imp_kernel_mod
    /kmkhz_9c_wtrac
    /lw_kernel_mod
    /pc2_bl_forced_cu
    /pc2_bm_initiate
    /pc2_initiation_ctl
    /pc2_initiation_kernel_mod
    /pc2_conv_coupling_kernel_mod
    /sw_kernel_mod
    /sw_rad_tile_kernel_mod
    /ukca_aero_ctl
    /ukca_chemistry_ctl_full_mod
    /ukca_main1-ukca_main1

  no_script:
    /ukca_abdulrazzak_ghan
